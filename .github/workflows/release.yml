# Builds a signed APK and AAB and publishes them as a GitHub release when a version tag is pushed.
#
# Release with:  git tag v1.3.4 && git push origin v1.3.4
# The tag must match versionName in app/build.gradle.kts (with a leading "v").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64     the release keystore (labophase-release.jks), base64-encoded
#   KEYSTORE_PASSWORD   storePassword from keystore.properties
#   KEY_ALIAS           keyAlias from keystore.properties
#   KEY_PASSWORD        keyPassword from keystore.properties

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check tag matches versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # keystore.properties is git-ignored; app/build.gradle.kts reads the signing config from it
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Labophase-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Labophase-$GITHUB_REF_NAME.aab"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Labophase $GITHUB_REF_NAME" --generate-notes
